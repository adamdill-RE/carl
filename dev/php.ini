; Reproduce the production limits locally (hosting Section 4 and Section 10).
; A constraint that will bite on the server should bite here first.
;
;   php -S 127.0.0.1:8088 -t public dev-router.php -c dev/php.ini

memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000

; No OPcache on the host, so every request recompiles every file it touches.
opcache.enable = 0
opcache.enable_cli = 0

; The host has these off/on respectively; the app must not depend on either.
display_errors = Off
log_errors = On

date.timezone = UTC
default_charset = UTF-8

; The cPanel-wide save path is not usable locally, and the app overrides it
; anyway before session_start() -- this only keeps the default out of the way.
session.gc_maxlifetime = 1440

; Absent on the host (hosting Section 4). Nothing may depend on them.
; extension=intl
; extension=sodium
